{% extends "base.html" %}
{% block title %}404 Not Found — StudentHub{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-primary mb-3">404</div>
  <h2 class="fw-bold mb-2">Page Not Found</h2>
  <p class="text-secondary max-w-md mx-auto mb-4">
    The page or academic resource you are looking for does not exist or has been moved.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
    <i class="bi bi-house-door me-1"></i> Back to Dashboard
  </a>
</div>
{% endblock %}
