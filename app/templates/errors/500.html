{% extends "base.html" %}
{% block title %}500 Internal Server Error — StudentHub{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-warning mb-3">500</div>
  <h2 class="fw-bold mb-2">Internal Server Error</h2>
  <p class="text-secondary max-w-md mx-auto mb-4">
    Something went wrong processing your request. The issue has been logged.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
    <i class="bi bi-arrow-repeat me-1"></i> Try Again
  </a>
</div>
{% endblock %}
